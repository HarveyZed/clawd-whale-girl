<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- our layer: amplitude tuned for the 0.68x display scale (target >= 2px on screen); upstream manifest used as baseline only -->
  <defs>
    <style>
      @keyframes shake { 0%,100% { transform: translateX(0) } 30% { transform: translateX(-3px) } 60% { transform: translateX(3px) } 80% { transform: translateX(-1.5px) } }
      #stage { animation: shake 0.3s linear infinite }
    </style>
  </defs>
  <g id="stage">
    <image href="error.webp" x="0" y="0" width="256" height="256"/>
  </g>
</svg>
